<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Putnu spēle</title>
    <style>
        :root {
            --bg: #0f172a; --surface: #1e293b; --accent: #38bdf8;
            --player: #facc15; --text: #f8fafc;
        }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center; 
            margin: 0; min-height: 100vh; justify-content: center;
        }
        #hud { 
            width: 340px; display: flex; justify-content: space-between; 
            padding: 15px 20px; background: var(--surface); 
            box-sizing: border-box; border-radius: 12px 12px 0 0;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .hud-center { text-align: center; color: var(--accent); text-transform: uppercase; font-size: 12px; }
        #game-container { position: relative; border-radius: 0 0 12px 12px; overflow: hidden; box-shadow: 1px 1px 10px black; }
        canvas { background: linear-gradient(to bottom, #1e293b, #0f172a); display: block; }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(4px);
            display: flex; flex-direction: column; justify-content: center; 
            align-items: center; text-align: center; z-index: 10;
        }
        .hidden { display: none !important; }
        input { 
            padding: 12px; margin-bottom: 10px; border: 2px solid var(--surface); 
            border-radius: 8px; background: #000; color: #fff; text-align: center; width: 200px;
        }
        .auth-buttons { display: flex; gap: 10px; }
        button { 
            padding: 12px 20px; cursor: pointer; background: var(--accent); 
            border: none; font-weight: 700; border-radius: 8px; text-transform: uppercase;
            transition: transform 0.1s;
        }
        button:hover { filter: brightness(1.1); transform: scale(1.05); }
        .btn-secondary { background: #475569; color: white; }
        #login-msg { color: #ef4444; font-size: 13px; margin-bottom: 10px; min-height: 1.2em; }
        table { width: 90%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .welcome-text { margin-bottom: 20px; }
        .welcome-text h2 { margin: 0; color: var(--accent); }
        .welcome-text p { margin: 5px 0; color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>

    <div id="hud">
        <span><small>PILOT</small><br><span id="hud-name">?</span></span>
        <span class="hud-center">Best<br><b id="hud-best">0</b></span>
        <span style="text-align:right"><small>SCORE</small><br><span id="hud-score">0</span></span>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="340" height="480"></canvas>

        <!-- 1. LOGIN EKRĀNS -->
        <div class="overlay" id="overlay-login">
            <h1>Putnu spēle</h1>
            <div id="login-msg"></div>
            <input type="text" id="username-input" placeholder="Lietotājvārds">
            <input type="password" id="password-input" placeholder="Parole">
            <div class="auth-buttons">
                <button id="btn-login">Ielogoties</button>
                <button id="btn-register" class="btn-secondary">Reģistrēties</button>
            </div>
        </div>

        <!-- 2. STARTA IZVĒLNE -->
        <div class="overlay hidden" id="overlay-start">
            <div class="welcome-text">
                <p>Ready for flight,</p>
                <h2 id="welcome-pilot">Pilot</h2>
            </div>
            <button id="btn-actual-start" style="font-size: 18px; padding: 15px 30px;">Start Mission</button>
            <button id="btn-logout" class="btn-secondary" style="margin-top: 40px; font-size: 11px;">Logout</button>
        </div>

        <!-- 3. GAME OVER EKRĀNS -->
        <div class="overlay hidden" id="overlay-go">
            <h2 style="color: #ef4444; margin-bottom: 5px;">MISSION FAILED</h2>
            <p style="margin-top: 0; color: #94a3b8;">Score: <span id="go-score" style="color: white; font-size: 32px; font-weight: bold;">0</span></p>
            
            <button id="btn-retry" style="width: 180px; margin-bottom: 10px;">Try Again</button>
            <!-- JAUNĀ POGA -->
            <button id="btn-exit-menu" class="btn-secondary" style="width: 180px; margin-bottom: 10px;">Exit to Menu</button>
            
            <button id="btn-lb" class="btn-secondary" style="width: 180px;">Leaderboard</button>
        </div>

        <!-- 4. LĪDERU SARAKSTS -->
        <div class="overlay hidden" id="overlay-lb">
            <h3>TOP PILOTS</h3>
            <div id="lb-content" style="width:100%; display:flex; justify-content:center;">Loading...</div>
            <button id="btn-lb-close" class="btn-secondary" style="margin-top:20px;">Back</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const API = 'api.php';

    const GRAVITY = 0.15, FLAP = -4.2, PIPE_SPEED = 2.2, PIPE_GAP = 160;
    let bird, pipes, score, frames, gameActive = false, username = "", sessionBest = 0;

    function reset() {
        bird = { x: 60, y: 200, v: 0, w: 34, h: 24 };
        pipes = []; score = 0; frames = 0;
        document.getElementById('hud-score').innerText = score;
    }

    function spawnPipe() {
        const h = Math.floor(Math.random() * (canvas.height - PIPE_GAP - 120)) + 60;
        pipes.push({ x: canvas.width, topH: h, scored: false });
    }

    function update() {
        if (!gameActive) return;
        frames++; bird.v += GRAVITY; bird.y += bird.v;
        if (frames % 90 === 0) spawnPipe();
        pipes.forEach(p => {
            p.x -= PIPE_SPEED;
            if (bird.x + bird.w - 4 > p.x && bird.x + 4 < p.x + 50) {
                if (bird.y + 4 < p.topH || bird.y + bird.h - 4 > p.topH + PIPE_GAP) endGame();
            }
            if (!p.scored && p.x + 50 < bird.x) {
                p.scored = true; score++;
                document.getElementById('hud-score').innerText = score;
            }
        });
        if (bird.y > canvas.height || bird.y < -50) endGame();
        pipes = pipes.filter(p => p.x > -60);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pipes.forEach(p => {
            ctx.fillStyle = "#22c55e"; ctx.fillRect(p.x, 0, 50, p.topH);
            ctx.fillRect(p.x, p.topH + PIPE_GAP, 50, canvas.height);
        });
        ctx.fillStyle = "#facc15"; ctx.fillRect(bird.x, bird.y, bird.w, bird.h);
        if (gameActive) requestAnimationFrame(() => { update(); draw(); });
    }

    async function endGame() {
        gameActive = false;
        document.getElementById('overlay-go').classList.remove('hidden');
        document.getElementById('go-score').innerText = score;
        try {
            const res = await fetch(`${API}?action=save`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ score })
            });
            const data = await res.json();
            if (data.best !== undefined) {
                sessionBest = data.best;
                document.getElementById('hud-best').innerText = sessionBest;
            }
        } catch (e) {}
    }

    const handleAction = () => { if(gameActive) bird.v = FLAP; };
    
    window.addEventListener('keydown', (e) => { 
        if(e.code === 'Space') { 
            if(gameActive) {
                e.preventDefault(); 
                handleAction(); 
            }
        } 
    });
    canvas.addEventListener('mousedown', handleAction);

    async function handleAuth(type) {
        const u = document.getElementById('username-input').value;
        const p = document.getElementById('password-input').value;
        const msg = document.getElementById('login-msg');
        try {
            const res = await fetch(`${API}?action=${type}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();
            if (data.error) msg.innerText = data.error;
            else {
                username = data.username; sessionBest = data.best;
                document.getElementById('hud-name').innerText = username;
                document.getElementById('hud-best').innerText = sessionBest;
                document.getElementById('welcome-pilot').innerText = username;
                
                document.getElementById('overlay-login').classList.add('hidden');
                document.getElementById('overlay-start').classList.remove('hidden');
            }
        } catch (e) { msg.innerText = "Servera kļūda!"; }
    }

    document.getElementById('btn-actual-start').onclick = () => {
        document.getElementById('overlay-start').classList.add('hidden');
        reset(); 
        gameActive = true; 
        draw();
    };

    document.getElementById('btn-login').onclick = () => handleAuth('login');
    document.getElementById('btn-register').onclick = () => handleAuth('register');
    
    document.getElementById('btn-retry').onclick = () => {
        document.getElementById('overlay-go').classList.add('hidden');
        reset(); gameActive = true; draw();
    };

    // FUNKCIJA ATGRIEŠANAI UZ IZVĒLNI
    document.getElementById('btn-exit-menu').onclick = () => {
        document.getElementById('overlay-go').classList.add('hidden');
        document.getElementById('overlay-start').classList.remove('hidden');
        reset(); // Notīrām spēles laukumu
        draw();  // Pārzīmējam tīru laukumu
    };

    document.getElementById('btn-lb').onclick = async () => {
        document.getElementById('overlay-lb').classList.remove('hidden');
        const res = await fetch(`${API}?action=leaderboard`);
        const data = await res.json();
        let h = '<table><tr><th>Pilot</th><th>Best</th></tr>';
        data.leaderboard.forEach(r => h += `<tr><td>${r.username}</td><td>${r.best_score}</td></tr>`);
        document.getElementById('lb-content').innerHTML = h + '</table>';
    };

    document.getElementById('btn-lb-close').onclick = () => document.getElementById('overlay-lb').classList.add('hidden');

    document.getElementById('btn-logout').onclick = () => {
        location.reload(); 
    };

    draw();
</script>
</body>
</html>
