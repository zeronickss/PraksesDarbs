<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
   
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --accent: #38bdf8;
            --player: #facc15;
            --obstacle: #4ade80; 
            --text: #f8fafc;
        }

        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
            min-height: 100vh;
            justify-content: center;
        }
        
        #hud { 
            width: 340px; 
            display: flex; 
            justify-content: space-between; 
            padding: 15px 20px; 
            background: var(--surface); 
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-sizing: border-box;
            border-radius: 12px 12px 0 0;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
        }
        #hud > span { flex: 1; }
        .hud-center { text-align: center; color: var(--accent); text-transform: uppercase; font-size: 12px; }
        .hud-right { text-align: right; }
        b { color: var(--player); }

        #game-container { 
            position: relative; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 0 0 12px 12px;
            overflow: hidden;
        }

        canvas { 
            background: linear-gradient(to bottom, #1e293b, #0f172a); 
            display: block; 
        }
        

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(4px);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            z-index: 10;
            transition: all 0.3s ease;
        }
        .hidden { display: none; opacity: 0; pointer-events: none; }
        
        h1 { font-size: 28px; margin-bottom: 20px; color: var(--accent); letter-spacing: -1px; }


        input { 
            padding: 12px; 
            margin-bottom: 15px; 
            border: 2px solid var(--surface); 
            border-radius: 8px;
            background: #000; 
            color: #fff; 
            text-align: center; 
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--accent); }

        button { 
            padding: 12px 24px; 
            cursor: pointer; 
            background: var(--accent); 
            border: none; 
            color: #000; 
            font-weight: 700; 
            border-radius: 8px;
            transition: transform 0.1s, filter 0.2s;
            text-transform: uppercase;
            font-size: 13px;
        }
        button:hover { filter: brightness(1.1); transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        .btn-secondary { background: #475569; color: white; }

        table { width: 85%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; font-size: 11px; text-transform: uppercase; color: #94a3b8; padding-bottom: 10px; }
        td { border-top: 1px solid rgba(255,255,255,0.05); padding: 8px 0; font-size: 14px; }
        .lb-scroll { max-height: 240px; overflow-y: auto; width: 100%; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <div id="hud">
        <span><small style="color:#94a3b8">PILOT</small><br><span id="hud-name">?</span></span>
        <span class="hud-center">Best Score<br><b id="hud-best">0</b></span>
        <span class="hud-right"><small style="color:#94a3b8">SCORE</small><br><span id="hud-score">0</span></span>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="340" height="480"></canvas>

        <div class="overlay" id="overlay-login">
            <h1>Putnu spēle</h1>
            <input type="text" id="username-input" placeholder="Pilot Name" maxlength="12">
            <button id="btn-start">Start Mission</button>
        </div>

        <div class="overlay hidden" id="overlay-go">
            <h2 style="color: #ef4444; margin-bottom:0;">MISSION FAILED</h2>
            <p style="color: #94a3b8; margin-bottom: 20px;">Score: <span id="go-score" style="color:white; font-size: 32px; font-weight: bold;">0</span></p>
            <button id="btn-retry">Try Again</button>
            <button id="btn-lb" class="btn-secondary">Leaderboard</button>
        </div>

        <div class="overlay hidden" id="overlay-lb">
            <h3>TOP PILOTS</h3>
            <div class="lb-scroll" id="lb-content">Loading...</div>
            <button id="btn-lb-close" class="btn-secondary" style="margin-top:20px;">Back</button>
        </div>
    </div>
</body>
</html>
